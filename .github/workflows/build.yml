name: Build and Minecraft tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run Minecraft 1.21.1 regression tests
        run: ./gradlew build runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sided-storage-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-test-logs
          path: run/logs/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sided-storage-neoforge-1.21.1
          path: jars
      - name: Publish tested jars
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" jars/*.jar --verify-tag --generate-notes --title "Sided Storage $RELEASE_TAG"
